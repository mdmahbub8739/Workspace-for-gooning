name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p \"require('./app.json').expo.version\")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "CFMobile-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK package
        uses: actions/upload-artifact@v4
        with:
          name: CFMobile-v${{ steps.version.outputs.version }}-apk
          path: CFMobile-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check if release tag exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        if: steps.tag.outputs.exists == 'false'
        run: node scripts/ci/extract-changelog.js "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CloudFlare Mobile v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: CFMobile-v${{ steps.version.outputs.version }}.apk
