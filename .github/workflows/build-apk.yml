name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Ensure debug keystore
        working-directory: android
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Switch release signing to debug key
        working-directory: android
        run: |
          sed -i 's/signingConfigs\.release/signingConfigs.debug/g' app/build.gradle
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" cloudflare-mobile.apk
          gh release create "build-${{ github.run_number }}" cloudflare-mobile.apk \
            --title "Build #${{ github.run_number }}" \
            --notes "Auto build from commit ${{ github.sha }}"
